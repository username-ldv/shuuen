name: web-ci

on:
  push:
    # Listing branches keeps tag pushes (app releases) from triggering this workflow.
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # `$env/static/public` fails the build when PUBLIC_SITE_URL is missing.
      - run: cp .env.example .env
      - run: bun run check
      - run: bun run build
      - run: docker build --target prod -t shuuen-web:ci .
