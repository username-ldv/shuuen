openapi: 3.2.0
info:
  title: Shuuen Backend API
  version: 1.0.0
  license:
    name: The Supreme Mandate of the Void 1.2
    url: https://github.com/username-ldv/shuuen-backend/blob/main/LICENSE
  description: >-
    Public catalog reads and role-aware account access. Catalog mutations require
    an administrator bearer token. Private reads additionally require
    include_private=true.
servers:
  - url: /
    description: Current origin
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    IncludePrivate:
      name: include_private
      in: query
      description: Requires an administrator bearer token when true.
      schema: { type: boolean, default: false }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: {}
    ListMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }
    User:
      type: object
      required: [id, username, display_name, role, created_at, updated_at]
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [user, admin] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, name, slug, color]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        color: { type: string }
    LibraryGroup:
      type: object
      required: [id, path, name, slug, sort_order, is_public]
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        path: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        is_public: { type: boolean }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
    FileVariant:
      type: object
      required: [id, melody_id, format, original_name, storage_path, size_bytes, checksum_sha256, is_primary]
      properties:
        id: { type: integer }
        melody_id: { type: integer }
        format: { type: string, enum: [midi, musicxml] }
        original_name: { type: string }
        stored_name: { type: string }
        storage_path: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        checksum_sha256: { type: string }
        is_primary: { type: boolean }
    Melody:
      type: object
      required: [id, group_id, source_path, file_stem, title, slug, sort_order, is_public]
      properties:
        id: { type: integer }
        group_id: { type: integer }
        source_path: { type: string }
        file_stem: { type: string }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        composer: { type: string }
        difficulty: { type: string }
        sort_order: { type: integer }
        is_public: { type: boolean }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/FileVariant' }
    GroupPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LibraryGroup' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    MelodyPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Melody' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    TagPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_]{3,20}$' }
        password: { type: string, minLength: 8, maxLength: 72 }
        display_name: { type: string, maxLength: 160 }
    AuthResult:
      type: object
      required: [user, access_token, token_type, expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
    CourseSection:
      type: object
      required: [library_group_id, name, path, depth]
      properties:
        library_group_id: { type: integer }
        name: { type: string }
        path: { type: string }
        depth: { type: integer, minimum: 1 }
    ProgressionGroup:
      type: object
      required: [id, library_group_id, name, description, sort_order, level_count, section_count, blueprint]
      properties:
        id:
          type: string
          description: Stable UUID for managed groups or library-{id} for folder-blueprint groups.
        library_group_id: { type: integer }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        level_count: { type: integer, format: int64 }
        section_count: { type: integer, format: int64 }
        blueprint: { type: boolean }
    CourseMode:
      type: object
      required: [mode, name, description, sort_order, group_count, level_count]
      properties:
        mode: { type: string, enum: [singles, melodies, chords] }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        group_count: { type: integer }
        level_count: { type: integer, format: int64 }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ProgressionGroup' }
    Course:
      type: object
      required:
        [id, library_group_id, slug, name, description, author, is_public, sort_order,
         structure_source, mode_count, progression_group_count, level_count]
      properties:
        id:
          type: integer
          description: Same stable id as the course's top-level library group.
        library_group_id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        author: { type: string }
        is_public: { type: boolean }
        sort_order: { type: integer }
        structure_source: { type: string, enum: [blueprint, managed] }
        mode_count: { type: integer }
        progression_group_count: { type: integer }
        level_count: { type: integer, format: int64 }
        modes:
          type: array
          items: { $ref: '#/components/schemas/CourseMode' }
    CoursePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Course' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    Pitch:
      type: string
      enum: [C, CSharp, D, DSharp, E, F, FSharp, G, GSharp, A, ASharp, B]
    Degree:
      type: string
      enum: [D1, D5, D2, D6, D3, D7, DS4, DF2, DF6, DF3, DF7, D4]
    Note:
      type: object
      required: [midi_index]
      properties:
        midi_index: { type: integer, minimum: 21, maximum: 108 }
    NoteRange:
      type: object
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/Note' }
        to: { $ref: '#/components/schemas/Note' }
    AbsoluteScaleConfig:
      type: object
      required: [root, scale_type, pitch_states]
      properties:
        type: { type: string, const: absolute }
        root: { $ref: '#/components/schemas/Pitch' }
        scale_type: { type: string, enum: [Major, NaturalMinor, Chromatic, Custom] }
        pitch_states:
          type: array
          minItems: 1
          items:
            type: object
            required: [pitch, active]
            properties:
              pitch: { $ref: '#/components/schemas/Pitch' }
              active: { type: boolean }
    RelativeScaleConfig:
      type: object
      required: [scale_type, degree_states]
      properties:
        type: { type: string, const: relative }
        scale_type: { type: string, enum: [Major, NaturalMinor, Chromatic, Custom] }
        degree_states:
          type: array
          minItems: 1
          items:
            type: object
            required: [degree, active]
            properties:
              degree: { $ref: '#/components/schemas/Degree' }
              active: { type: boolean }
    DegreeContext:
      type: object
      description: >-
        Adapted DegreeContext from the multiplatform app. Nodes carry first_degree,
        extra_degrees, sustain, duration, optional setup_melody, and relative_direction.
      required: [id, source, nodes]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: [string, 'null'] }
        source: { type: string, enum: [built_in, user, local, imported] }
        nodes:
          type: array
          minItems: 1
          items:
            type: object
            required: [first_degree, extra_degrees, sustain, duration, setup_melody, relative_direction]
            properties:
              first_degree:
                type: object
                required: [degree, octave]
                properties:
                  degree: { $ref: '#/components/schemas/Degree' }
                  octave: { type: integer, minimum: 0, maximum: 8 }
              extra_degrees:
                type: array
                items: { $ref: '#/components/schemas/Degree' }
              sustain:
                type: object
                required: [type]
                properties:
                  type: { type: string, enum: [endless, finite] }
                  duration_ms: { type: integer, format: int64, minimum: 1 }
              duration:
                type: object
                required: [type]
                properties:
                  type: { type: string, enum: [finite, immediate, endless, same_as_scale_rotation] }
                  duration_in_questions: { type: integer, minimum: 1 }
              setup_melody:
                type: [object, 'null']
                description: Relative melody plus Once or EveryTime repeat behavior.
              relative_direction: { type: string, enum: [Up, Down] }
    BackendMIDIFile:
      type: object
      required: [type, melody_id, variant_id, file_name]
      properties:
        type: { type: string, const: backend }
        melody_id: { type: integer }
        variant_id: { type: integer }
        file_name: { type: string }
    LocalMIDIFile:
      type: object
      description: Accepted only when the containing level is private.
      required: [type, path, file_name]
      properties:
        type: { type: string, const: local }
        path: { type: string }
        file_name: { type: string }
    CourseLevelDefinition:
      type: object
      description: >-
        Mode-specific level payload. Singles and chords use level_config plus context,
        questions_number, and range. Chords additionally require chord_size,
        sustain_notes, and answer_order. Melodies use config plus context. Config type
        is absolute/relative for singles and chords, and random/midi for melodies.
        Scale, context, rhythm-figure, melody-style, and chord-style values mirror the
        app structures and are validated by the API.
      additionalProperties: true
      properties:
        context:
          oneOf:
            - { $ref: '#/components/schemas/DegreeContext' }
            - { type: 'null' }
        questions_number: { type: [integer, 'null'], minimum: 1 }
        range: { $ref: '#/components/schemas/NoteRange' }
        level_config:
          type: object
          additionalProperties: true
          properties:
            type: { type: string, enum: [absolute, relative] }
            scale_config: { $ref: '#/components/schemas/RelativeScaleConfig' }
            scales:
              type: array
              items: { $ref: '#/components/schemas/AbsoluteScaleConfig' }
        config:
          type: object
          additionalProperties: true
          properties:
            type: { type: string, enum: [random, midi] }
            scale_config:
              oneOf:
                - { $ref: '#/components/schemas/AbsoluteScaleConfig' }
                - { $ref: '#/components/schemas/RelativeScaleConfig' }
            file:
              oneOf:
                - { $ref: '#/components/schemas/BackendMIDIFile' }
                - { $ref: '#/components/schemas/LocalMIDIFile' }
    CourseMIDIResource:
      type: object
      required: [melody_id, variant_id, download_url]
      properties:
        melody_id: { type: integer }
        variant_id: { type: integer }
        download_url: { type: string }
    CourseLevelNavigation:
      type: object
      description: >-
        Detail-only adjacency within the current progression group. Position is
        zero-based and uses the same ordering and visibility rules as the level list.
      required: [previous_level_id, next_level_id, position, total]
      properties:
        previous_level_id: { type: [string, 'null'] }
        next_level_id: { type: [string, 'null'] }
        position: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 1 }
    CourseLevel:
      type: object
      required: [id, progression_group_id, name, source, definition, sort_order, is_public, sections]
      properties:
        id: { type: string, maxLength: 64 }
        progression_group_id: { type: string }
        name: { type: string, maxLength: 220 }
        source: { type: string, enum: [built_in, user, imported] }
        definition: { $ref: '#/components/schemas/CourseLevelDefinition' }
        sort_order: { type: integer }
        is_public: { type: boolean }
        midi: { $ref: '#/components/schemas/CourseMIDIResource' }
        navigation:
          $ref: '#/components/schemas/CourseLevelNavigation'
          description: Present only on the single-level GET response.
        sections:
          type: array
          items: { $ref: '#/components/schemas/CourseSection' }
    CourseLevelPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CourseLevel' }
        meta: { $ref: '#/components/schemas/ListMeta' }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role or private scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /healthz:
    get:
      summary: Readiness check for database and storage
      operationId: healthCheck
      responses:
        '200': { description: Healthy }
        '503': { description: Database or storage unavailable }
  /api/v1/auth/register:
    post:
      summary: Register an ordinary user when registration is enabled
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/AuthResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Username already registered }
        '429': { description: Rate limit exceeded }
  /api/v1/auth/login:
    post:
      summary: Log in
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/AuthResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limit exceeded }
  /api/v1/auth/me:
    get:
      summary: Current user
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/password:
    post:
      summary: Change password and revoke previously issued tokens
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 72 }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Password changed and replacement token issued
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/courses:
    get:
      summary: List public courses without level payloads
      operationId: listCourses
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/IncludePrivate' }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Course summary page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoursePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an empty managed course and its top-level library folder
      operationId: createCourse
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 180 }
                slug: { type: string, maxLength: 220 }
                description: { type: string }
                author: { type: string, maxLength: 180 }
                is_public: { type: boolean, default: false }
                sort_order: { type: integer, default: 0 }
      responses:
        '201': { description: Created course }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Course slug or folder already exists }
  /api/v1/courses/{courseId}:
    get:
      summary: Get course metadata, modes, progression groups, and counts without levels
      operationId: getCourse
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - { $ref: '#/components/parameters/IncludePrivate' }
      responses:
        '200': { description: Course metadata and navigation hierarchy }
        '404': { description: Course not found or private }
    put:
      summary: Replace only course metadata; nested structure is untouched
      operationId: updateCourse
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, is_public]
              properties:
                name: { type: string, maxLength: 180 }
                description: { type: string }
                author: { type: string, maxLength: 180 }
                is_public: { type: boolean }
                sort_order: { type: integer }
      responses:
        '200': { description: Updated metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Course not found }
  /api/v1/courses/{courseId}/{mode}:
    get:
      summary: Get one mode and its progression-group metadata and counts
      operationId: getCourseMode
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [singles, melodies, chords] }
        - { $ref: '#/components/parameters/IncludePrivate' }
      responses:
        '200': { description: Course mode }
        '404': { description: Course or mode not found }
    put:
      summary: Replace one mode's metadata without touching its groups or levels
      operationId: updateCourseMode
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [singles, melodies, chords] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 180 }
                description: { type: string }
      responses:
        '200': { description: Updated mode }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Course or mode not found }
  /api/v1/courses/{courseId}/modes:
    post:
      summary: Add one mode to a course
      description: A folder blueprint is transparently made editable before the mode is added.
      operationId: createCourseMode
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [singles, melodies, chords] }
                name: { type: string, maxLength: 180 }
                description: { type: string }
                position: { type: integer, minimum: 0 }
      responses:
        '201': { description: Created mode }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Mode or folder already exists }
  /api/v1/courses/{courseId}/{mode}/position:
    put:
      summary: Move a mode to a zero-based position using a lightweight payload
      operationId: positionCourseMode
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [singles, melodies, chords] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties: { position: { type: integer, minimum: 0 } }
      responses:
        '204': { description: Reordered }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/courses/{courseId}/{mode}/groups:
    post:
      summary: Add one independent progression group/tab
      operationId: createProgressionGroup
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [singles, melodies, chords] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 180 }
                slug: { type: string, maxLength: 220 }
                description: { type: string }
                position: { type: integer, minimum: 0 }
      responses:
        '201': { description: Created progression group }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Group folder already exists }
  /api/v1/courses/{courseId}/{mode}/groups/{groupId}:
    put:
      summary: Replace one progression group's metadata
      operationId: updateProgressionGroup
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [singles, melodies, chords] }
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 180 }
                description: { type: string }
      responses:
        '200': { description: Updated progression group }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Course, mode, or group not found' }
  /api/v1/courses/{courseId}/{mode}/groups/{groupId}/position:
    put:
      summary: Move a progression group to a zero-based tab position
      operationId: positionProgressionGroup
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer }
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [singles, melodies, chords] }
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties: { position: { type: integer, minimum: 0 } }
      responses:
