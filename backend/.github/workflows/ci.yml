name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_DB: shuuen_test
          POSTGRES_USER: shuuen
          POSTGRES_PASSWORD: shuuen-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuuen -d shuuen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 user=shuuen password=shuuen-test-password dbname=shuuen_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go generate ./internal/model && git diff --exit-code -- internal/query/models.go
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: npx --yes @redocly/cli@2.38.0 lint openapi.yaml
      - run: docker build -t shuuen-backend:ci .
